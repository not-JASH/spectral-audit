schema_version = 3
experiment_id = "m1_dwt_16hz_phase0"

[record]
n_samples = 256
sampling_rate_hz = 128.0
sample_unit = "a.u."
mean_policy = "none"

[signal]
kind = "tones"
frequencies_hz = [16.0]
amplitudes = [1.0]
phases_rad = [0.0]

[[bands]]
name = "low"
lower_hz = 0.0
upper_hz = 16.0
include_upper = false

[[bands]]
name = "mid"
lower_hz = 16.0
upper_hz = 32.0
include_upper = false

[[bands]]
name = "high"
lower_hz = 32.0
upper_hz = 64.0
include_upper = true

[reference]
kind = "finite_record_dft"
fft_norm = "ortho"

[welch]
method_id = "welch_mean_density_v1"
segment_length = 64
noverlap = 32
nfft = 64
taper = "hann_periodic"
detrend = false
sidedness = "onesided"
scaling = "density"
average = "mean"
boundary = "none"
padding = "none"

[dwt]
method_id = "dwt_haar_periodization_level2_v1"
wavelet = "haar"
level = 2
mode = "periodization"
