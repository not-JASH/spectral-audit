[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-audit"
version = "0.1.0a1"
description = "Finite-record spectral measurement research scaffold"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jashua Luna"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2", "PyWavelets>=1.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
spectral-audit = "spectral_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
