name: M0 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: spectral-audit --help
      - run: spectral-audit --version
      - run: spectral-audit demo --config configs/m0_tones.toml --out results/ci_demo
